<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#534AB7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Keep It Fit">
  <title>Keep It Fit · FitAI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.34.0/css/tabler-icons.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    /* ── CSS Variables (Light & Dark) ─────────────────────── */
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --color-background-primary:   #ffffff;
      --color-background-secondary: #f5f7fa;
      --color-background-tertiary:  #eef0f5;
      --color-text-primary:         #111827;
      --color-text-secondary:       #6b7280;
      --color-border-tertiary:      #e5e7eb;
      --color-border-secondary:     #d1d5db;
      --border-radius-lg:           14px;
      --border-radius-md:           9px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --color-background-primary:   #1c1c1e;
        --color-background-secondary: #2c2c2e;
        --color-background-tertiary:  #000000;
        --color-text-primary:         #f2f2f7;
        --color-text-secondary:       #8e8e93;
        --color-border-tertiary:      #38383a;
        --color-border-secondary:     #48484a;
      }
    }
    /* ── Reset & Base ──────────────────────────────────────── */
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow:hidden}
    body{font-family:var(--font-sans);background:var(--color-background-secondary);overscroll-behavior:none}
    #root{max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
    /* ── Topbar ─────────────────────────────────────────────── */
    .topbar{background:var(--color-background-primary);border-bottom:.5px solid var(--color-border-tertiary);display:flex;align-items:center;padding:10px 16px;gap:10px;flex-shrink:0;z-index:10}
    .tb-info{flex:1}.tb-date{font-size:15px;font-weight:600;color:var(--color-text-primary)}.tb-sub{font-size:11px;color:var(--color-text-secondary);margin-top:1px}
    .sync-btn{width:36px;height:36px;border-radius:18px;border:.5px solid var(--color-border-tertiary);background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text-secondary);font-size:18px;flex-shrink:0}
    /* ── Pages ─────────────────────────────────────────────── */
    .pages{flex:1;overflow:hidden;position:relative}
    .page{position:absolute;inset:0;display:none;overflow-y:auto;padding:12px;padding-bottom:70px;-webkit-overflow-scrolling:touch}
    .page.active{display:block}
    /* ── Bottom Nav ─────────────────────────────────────────── */
    .bottom-nav{background:var(--color-background-primary);border-top:.5px solid var(--color-border-tertiary);display:flex;flex-shrink:0;height:58px;padding-bottom:env(safe-area-inset-bottom)}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;color:var(--color-text-secondary);cursor:pointer;font-family:var(--font-sans);padding:4px 2px}
    .nav-btn.active{color:#534AB7}.nav-btn i{font-size:22px}.nav-btn span{font-size:10px;font-weight:600}
    /* ── Cards ─────────────────────────────────────────────── */
    .card{background:var(--color-background-primary);border-radius:var(--border-radius-lg);border:.5px solid var(--color-border-tertiary);padding:14px;margin-bottom:10px}
    .ct{font-size:11px;font-weight:600;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}.ct i{font-size:13px}
    /* ── Metrics ─────────────────────────────────────────────── */
    .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .metric{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px}
    .ml{font-size:11px;color:var(--color-text-secondary);margin-bottom:2px}.mv{font-size:20px;font-weight:600;color:var(--color-text-primary)}.ms{font-size:11px;color:var(--color-text-secondary)}
    /* ── Progress bars ────────────────────────────────────────── */
    .prow{display:flex;align-items:center;gap:8px;margin-bottom:7px}.prow:last-child{margin-bottom:0}
    .plbl{font-size:12px;color:var(--color-text-secondary);width:72px;flex-shrink:0}
    .pbar{flex:1;height:5px;background:var(--color-background-secondary);border-radius:3px;overflow:hidden}
    .pfill{height:100%;border-radius:3px;transition:width .3s}.pval{font-size:11px;color:var(--color-text-secondary);width:34px;text-align:right;flex-shrink:0}
    /* ── Meals ───────────────────────────────────────────────── */
    .meal{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:.5px solid var(--color-border-tertiary)}.meal:last-child{border-bottom:none;padding-bottom:0}
    .meal-info{flex:1;min-width:0}.meal-name{font-size:13px;font-weight:500;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meal-sub{font-size:11px;color:var(--color-text-secondary);margin-top:1px}.meal-cal{font-size:13px;font-weight:600;color:var(--color-text-primary);flex-shrink:0}
    .delbtn{width:28px;height:28px;border:none;background:none;color:var(--color-text-secondary);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:var(--border-radius-md);font-size:15px;flex-shrink:0}
    /* ── Forms ───────────────────────────────────────────────── */
    .flbl{font-size:12px;color:var(--color-text-secondary);margin-bottom:4px;display:block}.frow{margin-bottom:10px}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
    input,select,textarea{width:100%;padding:10px 12px;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);font-size:15px;font-family:var(--font-sans);-webkit-appearance:none}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#AFA9EC}
    input[type=number]{-moz-appearance:textfield}input[type=number]::-webkit-inner-spin-button{opacity:0}
    input[type=checkbox]{width:20px;height:20px;margin:0;flex-shrink:0;accent-color:#534AB7}
    /* ── Buttons ─────────────────────────────────────────────── */
    .btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border-radius:var(--border-radius-lg);border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font-sans);margin-top:8px;-webkit-tap-highlight-color:transparent}
    .bp{background:#534AB7;color:#fff}.bp:active{opacity:.8}
    .bo{background:none;border:.5px solid var(--color-border-secondary);color:var(--color-text-primary)}.bo:active{background:var(--color-background-secondary)}
    .bg{background:none;border:.5px dashed var(--color-border-secondary);color:var(--color-text-secondary);font-size:13px;padding:10px}
    .bw{background:#FAECE7;color:#993C1D;border:none;font-size:13px;padding:9px}
    /* ── Exercise cards ──────────────────────────────────────── */
    .ex-card{border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);margin-bottom:8px;overflow:hidden;background:var(--color-background-primary)}
    .ex-hdr{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}
    .ex-name{flex:1;font-size:14px;font-weight:600;color:var(--color-text-primary)}.ex-badge{font-size:11px;padding:2px 8px;border-radius:20px;background:#EEEDFE;color:#3C3489;flex-shrink:0}
    .ex-body{padding:0 14px 12px;display:none}
    .srow{display:flex;align-items:center;gap:5px;padding:7px 0;border-top:.5px solid var(--color-border-tertiary)}
    .sn{font-size:12px;color:var(--color-text-secondary);width:40px;flex-shrink:0}
    .sinp{width:52px;padding:7px 4px;text-align:center;border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);font-size:14px;background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans)}
    .slbl{font-size:12px;color:var(--color-text-secondary)}
    .schk{width:34px;height:34px;border-radius:50%;border:.5px solid var(--color-border-tertiary);background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--color-text-secondary);font-size:16px;margin-left:auto;flex-shrink:0}
    .schk.done{background:#E1F5EE;border-color:#5DCAA5;color:#0F6E56}
    /* ── Pills ───────────────────────────────────────────────── */
    .pill{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
    .pg{background:#E1F5EE;color:#0F6E56}.pa{background:#FAEEDA;color:#854F0B}.pp{background:#EEEDFE;color:#3C3489}.pgr{background:var(--color-background-secondary);color:var(--color-text-secondary)}.pm{background:#E6F1FB;color:#185FA5}
    /* ── Misc ────────────────────────────────────────────────── */
    .muted{font-size:13px;color:var(--color-text-secondary);line-height:1.5}
    .row2{display:flex;gap:8px;margin-bottom:10px}.row2 .btn{margin-top:0;flex:1;font-size:12px;padding:9px 4px}
    .ptabs{display:flex;background:var(--color-background-primary);border:.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);margin-bottom:12px;overflow:hidden}
    .ptab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;color:var(--color-text-secondary);border:none;background:none;font-family:var(--font-sans);border-bottom:2px solid transparent}
    .ptab.active{color:#534AB7;border-bottom-color:#534AB7}
    .tip{background:#EEEDFE;border-radius:var(--border-radius-md);padding:10px 12px;display:flex;gap:8px;margin-bottom:10px;align-items:flex-start}
    .tip i{color:#534AB7;font-size:15px;flex-shrink:0;margin-top:1px}.tip p{font-size:12px;color:#3C3489;line-height:1.5}
    .tip-g{background:#E1F5EE}.tip-g i{color:#0F6E56}.tip-g p{color:#0F6E56}
    .rpt{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;font-size:11px;font-family:monospace;color:var(--color-text-primary);white-space:pre-wrap;max-height:220px;overflow-y:auto;margin-bottom:10px;line-height:1.6}
    .lib-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:.5px solid var(--color-border-tertiary)}.lib-item:last-child{border-bottom:none}
    .lib-name{flex:1;font-size:13px;color:var(--color-text-primary)}.lib-cat{font-size:10px;padding:2px 6px;border-radius:10px;background:var(--color-background-secondary);color:var(--color-text-secondary)}
    .mchip{font-size:11px;padding:2px 6px;border-radius:10px;background:var(--color-background-secondary);color:var(--color-text-secondary);white-space:nowrap;display:inline-block;margin:2px}
    .mhist-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:.5px solid var(--color-border-tertiary)}.mhist-row:last-child{border-bottom:none}
    .mhist-date{width:60px;flex-shrink:0}
    .agenda-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid var(--color-border-tertiary)}.agenda-row:last-child{border-bottom:none}
    .agenda-date{width:62px;flex-shrink:0;font-size:12px;font-weight:500;color:var(--color-text-primary)}
    .agenda-name{flex:1;font-size:13px;color:var(--color-text-primary)}.agenda-ex{font-size:11px;color:var(--color-text-secondary)}
    /* ── Toast ───────────────────────────────────────────────── */
    .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-family:var(--font-sans);z-index:1000;opacity:0;transition:opacity .3s;pointer-events:none;max-width:320px;text-align:center}
    .toast.show{opacity:1}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}.spinning{animation:spin 1s linear infinite;display:inline-block}
  </style>
</head>
<body>

<div id="root">
  <header class="topbar">
    <div class="tb-info">
      <div class="tb-date" id="tbDate">—</div>
      <div class="tb-sub">Keep It Fit · FitAI</div>
    </div>
    <button class="sync-btn" onclick="doSync()" id="syncBtn" aria-label="Sincronizează cu Google Sheets">
      <i class="ti ti-refresh" aria-hidden="true" id="syncIcon"></i>
    </button>
  </header>

  <div class="pages">
    <div id="p-azi"       class="page active"></div>
    <div id="p-nutritie"  class="page"></div>
    <div id="p-sport"     class="page"></div>
    <div id="p-corp"      class="page"></div>
    <div id="p-setari"    class="page"></div>
  </div>

  <nav class="bottom-nav" aria-label="Navigare principală">
    <button class="nav-btn active" id="nav-azi"       onclick="goTo('azi')">      <i class="ti ti-home"      aria-hidden="true"></i><span>Azi</span></button>
    <button class="nav-btn"        id="nav-nutritie"  onclick="goTo('nutritie')"> <i class="ti ti-apple"     aria-hidden="true"></i><span>Nutriție</span></button>
    <button class="nav-btn"        id="nav-sport"     onclick="goTo('sport')">    <i class="ti ti-barbell"   aria-hidden="true"></i><span>Sport</span></button>
    <button class="nav-btn"        id="nav-corp"      onclick="goTo('corp')">     <i class="ti ti-ruler"     aria-hidden="true"></i><span>Corp</span></button>
    <button class="nav-btn"        id="nav-setari"    onclick="goTo('setari')">   <i class="ti ti-settings"  aria-hidden="true"></i><span>Setări</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
// ─── STORAGE (localStorage) ───────────────────────────────
function dbGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function dbSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// ─── TOAST ────────────────────────────────────────────────
function showToast(msg,ms){var t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},ms||2800);}

// ─── CLIPBOARD ────────────────────────────────────────────
function copyText(text,successMsg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){showToast(successMsg||'✓ Copiat în clipboard!');}).catch(function(){fallbackCopy(text,successMsg);});
  }else{fallbackCopy(text,successMsg);}
}
function fallbackCopy(text,msg){
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');showToast(msg||'✓ Copiat!');}catch(e){showToast('Copiază manual din previzualizare.');}
  document.body.removeChild(ta);
}

// ─── CONSTANTS ────────────────────────────────────────────
var DAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
var DAY_RO={monday:'Luni',tuesday:'Marți',wednesday:'Miercuri',thursday:'Joi',friday:'Vineri',saturday:'Sâmbătă',sunday:'Duminică'};
var DAY_SHORT=['Du','Lu','Ma','Mi','Jo','Vi','Sâ'];
var MONTHS_S=['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','nov','dec'];
var MONTHS_FULL=['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
var MKEYS=['weight','waist','hip','arm','thigh','chest','shoulder'];
var MLBL={weight:'Greutate',waist:'Talie',hip:'Șold',arm:'Braț',thigh:'Coapsă',chest:'Piept',shoulder:'Umăr'};
var MUNIT={weight:'kg',waist:'cm',hip:'cm',arm:'cm',thigh:'cm',chest:'cm',shoulder:'cm'};
var MPHOLD={weight:'84.5',waist:'88',hip:'98',arm:'36',thigh:'54',chest:'100',shoulder:'112'};

// ─── STATE ────────────────────────────────────────────────
var A={
  page:'azi',today:'',todayKey:'',todayName:'',
  nutTab:'jurnal',sportTab:'azi',corpMetric:'weight',
  openEx:{},showAddEx:false,showAltForm:false,syncSt:'idle',
  charts:{},reportText:'',
  settings:{targets:{cal:2200,p:160,c:230,f:80},sheetsUrl:'',spreadId:''},
  plan:{},monthPlan:{},logs:{},exLib:[]
};

// ─── HELPERS ──────────────────────────────────────────────
function $(id){return document.getElementById(id);}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function R(n){return Math.round(n||0);}
function pct(v,mx){return mx?Math.min(100,Math.round((v/mx)*100)):0;}
function fmtDate(d){var dt=new Date(d+'T00:00');return dt.getDate()+' '+MONTHS_S[dt.getMonth()];}
function fmtDateShort(d){var dt=new Date(d+'T00:00');return DAY_SHORT[dt.getDay()]+' '+dt.getDate()+'.'+(dt.getMonth()+1);}

function todayLog(){if(!A.logs[A.today])A.logs[A.today]={meals:[],workout:null,measurements:{}};return A.logs[A.today];}

function todaySource(){
  if(A.monthPlan&&A.monthPlan[A.today])return{day:A.monthPlan[A.today],src:'lunar'};
  if(A.plan&&A.plan[A.todayKey])return{day:A.plan[A.todayKey],src:'saptamanal'};
  return{day:null,src:'manual'};
}

function todayWorkout(){
  var log=todayLog();
  if(!log.workout){var s=todaySource();log.workout={status:'pending',type:'',rpe:0,note:'',src:s.src,exercises:s.day?s.day.exercises.map(function(e){return{name:e.name,planId:e.id,hasWeight:!!e.hasWeight,sets:Array.from({length:e.sets||3},function(){return{r:parseInt(e.reps)||10,w:parseFloat(e.weight)||0,done:false};})};}):[]};}
  return log.workout;
}

function dayTotals(date){var meals=(A.logs[date]||{}).meals||[];return meals.reduce(function(a,m){return{cal:a.cal+(m.cal||0),p:a.p+(m.p||0),c:a.c+(m.c||0),f:a.f+(m.f||0)};},{cal:0,p:0,c:0,f:0});}
function last7Dates(){return Array.from({length:7},function(_,i){var d=new Date();d.setDate(d.getDate()-(6-i));return d.toISOString().split('T')[0];});}
function lastNDates(n){return Array.from({length:n},function(_,i){var d=new Date();d.setDate(d.getDate()-(n-1-i));return d.toISOString().split('T')[0];});}

function getUpcoming(n){var res=[];var now=new Date();for(var i=1;i<=45&&res.length<n;i++){var d=new Date(now);d.setDate(d.getDate()+i);var ds=d.toISOString().split('T')[0];if(A.monthPlan&&A.monthPlan[ds])res.push({date:ds,name:A.monthPlan[ds].name,exercises:(A.monthPlan[ds].exercises||[]).length,done:!!(A.logs[ds]&&A.logs[ds].workout&&A.logs[ds].workout.status==='done')});}return res;}

function getMeasHistory(metric){var cut=new Date();cut.setMonth(cut.getMonth()-3);var cutStr=cut.toISOString().split('T')[0];var hist=[];Object.entries(A.logs).forEach(function(e){var date=e[0],log=e[1];if(date<cutStr)return;var m=log.measurements||{};if(m[metric]&&m[metric]>0)hist.push({date:date,value:m[metric]});});return hist.sort(function(a,b){return a.date.localeCompare(b.date);});}

function exHistory(name){var cut=new Date();cut.setMonth(cut.getMonth()-3);var cutStr=cut.toISOString().split('T')[0];var hist=[];Object.entries(A.logs).forEach(function(e){var date=e[0],log=e[1];if(date<cutStr)return;((log.workout||{}).exercises||[]).forEach(function(ex){if(ex.name.toLowerCase()===name.toLowerCase()){var done=ex.sets.filter(function(s){return s.done;});if(done.length)hist.push({date:date,maxW:Math.max.apply(null,done.map(function(s){return s.w||0;}))});}});});return hist.sort(function(a,b){return a.date.localeCompare(b.date);});}

function allExNamesWithWeight(){var s={};Object.values(A.logs).forEach(function(l){((l.workout||{}).exercises||[]).forEach(function(e){if(e.hasWeight)s[e.name]=1;});});A.exLib.forEach(function(e){if(e.hasWeight)s[e.name]=1;});return Object.keys(s).sort();}

function persist(){dbSet('fitai-settings',A.settings);dbSet('fitai-plan',A.plan);dbSet('fitai-monthplan',A.monthPlan);dbSet('fitai-logs',A.logs);dbSet('fitai-exlib',A.exLib);}

// ─── SYNC ─────────────────────────────────────────────────
function pushSheets(p){
  if(!A.settings.sheetsUrl)return;
  // Folosim text/plain pentru compatibilitate no-cors cu Apps Script
  fetch(A.settings.sheetsUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)}).catch(function(){});
}

function doSync(){
  A.syncSt='syncing';updateSync();
  var log=todayLog();
  pushSheets({type:'daily_log',date:A.today,nutrition:Object.assign({},dayTotals(A.today),{meals:log.meals}),workout:log.workout,measurements:log.measurements||{},targets:A.settings.targets});
  persist();
  setTimeout(function(){A.syncSt='synced';updateSync();showToast('✓ Sincronizat cu Google Sheets');setTimeout(function(){A.syncSt='idle';updateSync();},2500);},600);
}

function updateSync(){var i=$('syncIcon');if(!i)return;if(A.syncSt==='syncing')i.className='ti ti-loader-2 spinning';else if(A.syncSt==='synced'){i.className='ti ti-check';i.style.color='#0F6E56';}else{i.className='ti ti-refresh';i.style.color='';}}

// ─── NAVIGATION ───────────────────────────────────────────

function renderNutJurnal(){var log=todayLog(),tot=dayTotals(A.today);var mh=log.meals.length?log.meals.map(function(m){return'<div class="meal"><div class="meal-info"><div class="meal-name">'+m.name+'</div><div class="meal-sub">'+(m.time||'')+' · P:'+R(m.p)+'g C:'+R(m.c)+'g G:'+R(m.f)+'g</div></div><div class="meal-cal">'+R(m.cal)+' kcal</div><button class="delbtn" onclick="delMeal(\''+m.id+'\')" aria-label="Șterge"><i class="ti ti-x" aria-hidden="true"></i></button></div>';}).join(''):'<p class="muted" style="padding:6px 0">Nicio masă adăugată azi.</p>';$('nutContent').innerHTML='<div class="card"><div class="ct"><i class="ti ti-plus-circle" aria-hidden="true"></i>Adaugă masă</div><div class="frow"><label class="flbl">Denumire</label><input type="text" id="mN" placeholder="ex: Piept pui 200g la grătar"></div><div class="frow"><label class="flbl">Calorii (kcal)</label><input type="number" id="mK" placeholder="0" inputmode="numeric"></div><div class="g3" style="margin-bottom:10px"><div><label class="flbl">Proteină g</label><input type="number" id="mP" placeholder="0" inputmode="numeric"></div><div><label class="flbl">Carb g</label><input type="number" id="mC" placeholder="0" inputmode="numeric"></div><div><label class="flbl">Grăsimi g</label><input type="number" id="mF" placeholder="0" inputmode="numeric"></div></div><button class="btn bp" onclick="addMeal()"><i class="ti ti-check" aria-hidden="true"></i>Adaugă</button></div><div class="card"><div class="ct"><i class="ti ti-list" aria-hidden="true"></i>Mese azi · '+R(tot.cal)+' kcal total</div>'+mh+'</div>';}
function addMeal(){var name=($('mN').value||'').trim();if(!name)return;todayLog().meals.push({id:genId(),name:name,cal:parseFloat($('mK').value)||0,p:parseFloat($('mP').value)||0,c:parseFloat($('mC').value)||0,f:parseFloat($('mF').value)||0,time:new Date().toTimeString().slice(0,5)});persist();renderNutJurnal();showToast('✓ Masă adăugată');}
function delMeal(id){var log=todayLog();log.meals=log.meals.filter(function(m){return m.id!==id;});persist();renderNutJurnal();}

function renderNutStats(){var l7=last7Dates(),t=A.settings.targets;var calData=l7.map(function(d){return R(dayTotals(d).cal);});var pData=l7.map(function(d){return R(dayTotals(d).p);});var cData=l7.map(function(d){return R(dayTotals(d).c);});var fData=l7.map(function(d){return R(dayTotals(d).f);});var labels=l7.map(function(d){var dt=new Date(d+'T00:00');return DAY_SHORT[dt.getDay()]+' '+dt.getDate();});var dL=l7.filter(function(d){return A.logs[d]&&(A.logs[d].meals||[]).length>0;}).length;function avg(arr){return dL?R(arr.reduce(function(a,v){return a+v;},0)/dL):0;}$('nutContent').innerHTML='<div class="card"><div class="ct"><i class="ti ti-chart-bar" aria-hidden="true"></i>Calorii · 7 zile</div><canvas id="cChart" height="150"></canvas></div><div class="card"><div class="ct"><i class="ti ti-calculator" aria-hidden="true"></i>Medii săptămânale</div><div class="mgrid"><div class="metric"><div class="ml">Calorii/zi</div><div class="mv">'+avg(calData)+'</div><div class="ms">obiectiv '+t.cal+'</div></div><div class="metric"><div class="ml">Proteină/zi</div><div class="mv">'+avg(pData)+'g</div><div class="ms">obiectiv '+t.p+'g</div></div><div class="metric"><div class="ml">Carb/zi</div><div class="mv">'+avg(cData)+'g</div><div class="ms">obiectiv '+t.c+'g</div></div><div class="metric"><div class="ml">Grăsimi/zi</div><div class="mv">'+avg(fData)+'g</div><div class="ms">obiectiv '+t.f+'g</div></div></div></div><div class="card"><div class="ct"><i class="ti ti-chart-line" aria-hidden="true"></i>Macronutrienți · 7 zile</div><canvas id="mChart" height="150"></canvas></div>';setTimeout(function(){var isDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;var gc=isDark?'rgba(255,255,255,.07)':'rgba(0,0,0,.05)',tc=isDark?'rgba(255,255,255,.4)':'rgba(0,0,0,.35)';var c1=$('cChart');if(c1&&typeof Chart!=='undefined')A.charts.cn=new Chart(c1,{type:'bar',data:{labels:labels,datasets:[{data:calData,backgroundColor:calData.map(function(v){return v>t.cal?'#D85A30':'#534AB7';}),borderRadius:4}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.parsed.y+' kcal';}}}},scales:{y:{grid:{color:gc},ticks:{color:tc,font:{size:10}}},x:{grid:{display:false},ticks:{color:tc,font:{size:10}}}}}});var c2=$('mChart');if(c2&&typeof Chart!=='undefined')A.charts.cm=new Chart(c2,{type:'line',data:{labels:labels,datasets:[{label:'P',data:pData,borderColor:'#1D9E75',backgroundColor:'rgba(29,158,117,.08)',tension:.3,fill:true,pointRadius:3},{label:'C',data:cData,borderColor:'#BA7517',backgroundColor:'rgba(186,117,23,.05)',tension:.3,fill:true,pointRadius:3},{label:'G',data:fData,borderColor:'#D4537E',backgroundColor:'rgba(212,83,126,.05)',tension:.3,fill:true,pointRadius:3}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:10,padding:8}}},scales:{y:{grid:{color:gc},ticks:{color:tc,font:{size:10}}},x:{grid:{display:false},ticks:{color:tc,font:{size:10}}}}}});},80);}

function renderNutRapoarte(){var rptHtml=A.reportText?'<div class="rpt">'+A.reportText+'</div><div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn bp" style="flex:1;margin:0" onclick="sendRpt()"><i class="ti ti-copy" aria-hidden="true"></i>Copiază pentru FitAI</button><button class="btn bo" style="flex:1;margin:0" onclick="dlRpt()"><i class="ti ti-download" aria-hidden="true"></i>Descarcă .txt</button></div>':'';$('nutContent').innerHTML='<div class="card"><div class="ct"><i class="ti ti-file-analytics" aria-hidden="true"></i>Generează raport</div><p class="muted" style="margin-bottom:10px">Include nutriție, antrenamente și măsurători corporale.</p><div class="row2"><button class="btn bo" onclick="showRpt(\'week\')" style="margin-top:0"><i class="ti ti-calendar-week" aria-hidden="true"></i>Săptămânal (7 zile)</button><button class="btn bo" onclick="showRpt(\'month\')" style="margin-top:0"><i class="ti ti-calendar-month" aria-hidden="true"></i>Lunar (30 zile)</button></div>'+rptHtml+'</div>';}
function genReport(n){var dates=lastNDates(n),t=A.settings.targets;var dL=dates.filter(function(d){return A.logs[d]&&(A.logs[d].meals||[]).length>0;}).length;var avgCal=dL?R(dates.reduce(function(a,d){return a+dayTotals(d).cal;},0)/dL):0;var avgP=dL?R(dates.reduce(function(a,d){return a+dayTotals(d).p;},0)/dL):0;var avgC=dL?R(dates.reduce(function(a,d){return a+dayTotals(d).c;},0)/dL):0;var avgF=dL?R(dates.reduce(function(a,d){return a+dayTotals(d).f;},0)/dL):0;var wDone=dates.filter(function(d){return A.logs[d]&&(A.logs[d].workout||{}).status==='done';}).length;var wSkip=dates.filter(function(d){return A.logs[d]&&(A.logs[d].workout||{}).status==='skip';}).length;var rpes=dates.map(function(d){return(A.logs[d]&&A.logs[d].workout&&A.logs[d].workout.rpe)||0;}).filter(function(r){return r>0;});var avgRpe=rpes.length?(rpes.reduce(function(a,v){return a+v;},0)/rpes.length).toFixed(1):'N/A';var mDates=dates.filter(function(d){return A.logs[d]&&A.logs[d].measurements&&Object.values(A.logs[d].measurements).some(function(v){return v>0;});});var startM=mDates.length?A.logs[mDates[0]].measurements:{};var endM=mDates.length?A.logs[mDates[mDates.length-1]].measurements:{};var measLines='';MKEYS.forEach(function(k){if(startM[k]||endM[k]){var delta=(endM[k]&&startM[k])?(endM[k]-startM[k]).toFixed(1):null;measLines+=MLBL[k]+': '+(startM[k]||'?')+' → '+(endM[k]||'?')+' '+MUNIT[k]+(delta!==null?' ('+(parseFloat(delta)>0?'+':'')+delta+')':'')+'\n';}});var tag=n===7?'#REPORT_SAPTAMANAL':'#REPORT_LUNAR';var txt=tag+' '+A.today+'\nPERIOADA: '+dates[0]+' – '+dates[dates.length-1]+'\n\n=== NUTRIȚIE ===\nZile logate: '+dL+'/'+n+'\nMedie calorii: '+avgCal+' kcal (obiectiv: '+t.cal+')\nMedie proteine: '+avgP+'g (obiectiv: '+t.p+'g)\nMedie carbohidrați: '+avgC+'g\nMedie grăsimi: '+avgF+'g\n\n=== ANTRENAMENTE ===\nSesiuni complete: '+wDone+'/'+n+'\nSesiuni skip: '+wSkip+'\nMedie RPE: '+avgRpe+'\n\n';if(measLines)txt+='=== MĂSURĂTORI CORPORALE ===\n'+measLines+'\n';txt+='=== GENERAT DIN KEEP IT FIT ===';return txt;}
function showRpt(type){A.reportText=genReport(type==='week'?7:30);renderNutRapoarte();}
function sendRpt(){if(A.reportText)copyText(A.reportText,'✓ Raport copiat! Lipește-l în chat-ul FitAI.');}
function dlRpt(){if(!A.reportText)return;var type=A.reportText.includes('SAPTAMANAL')?'saptamanal':'lunar';var blob=new Blob([A.reportText],{type:'text/plain;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='fitai-'+type+'-'+A.today+'.txt';a.click();URL.revokeObjectURL(url);}

function showExChart(name){if(A.charts.ex){try{A.charts.ex.destroy();}catch(e){}}if(!name)return;var hist=exHistory(name),note=$('exNote'),ctx=$('exChart');if(!hist.length){if(note)note.textContent='Nicio sesiune logată în ultimele 3 luni.';return;}var vals=hist.map(function(h){return h.maxW;});if(note)note.textContent=hist.length+' sesiuni · Max: '+Math.max.apply(null,vals)+' kg';var isDark=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;var gc=isDark?'rgba(255,255,255,.07)':'rgba(0,0,0,.05)',tc=isDark?'rgba(255,255,255,.4)':'rgba(0,0,0,.35)';A.charts.ex=new Chart(ctx,{type:'line',data:{labels:hist.map(function(h){var d=new Date(h.date+'T00:00');return d.getDate()+'.'+(d.getMonth()+1);}),datasets:[{data:vals,borderColor:'#534AB7',backgroundColor:'rgba(83,74,183,.1)',tension:.3,fill:true,pointRadius:4,pointBackgroundColor:'#534AB7'}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.parsed.y+' kg';}}}},scales:{y:{grid:{color:gc},ticks:{color:tc,font:{size:10},callback:function(v){return v+'kg';}}},x:{grid:{display:false},ticks:{color:tc,font:{size:10}}}}}});}

  '<div class="card"><div class="ct"><i class="ti ti-dumbbell" aria-hidden="true"></i>Bibliotecă exerciții</div><div class="frow"><label class="flbl">Denumire exercițiu</label><input type="text" id="libName" placeholder="ex: Împins la piept cu bara"></div><div class="g2" style="margin-bottom:10px"><div><label class="flbl">Categorie</label><select id="libCat"><option value="forta">Forță</option><option value="cardio">Cardio</option><option value="mobilitate">Mobilitate</option></select></div><div style="display:flex;flex-direction:column;justify-content:flex-end"><div style="display:flex;align-items:center;gap:8px;padding-bottom:10px"><input type="checkbox" id="libHasW"><label for="libHasW" style="font-size:13px;color:var(--color-text-secondary);cursor:pointer">Cu greutate (kg)</label></div></div></div><button class="btn bp" id="btnAddLib" onclick="addLibEx()"><i class="ti ti-plus" aria-hidden="true"></i>Adaugă în bibliotecă</button><div style="margin-top:12px">'+libHtml+'</div>'+(A.exLib.length?'<button class="btn bo" onclick="exportLib()" style="margin-top:8px;font-size:12px;padding:9px"><i class="ti ti-download" aria-hidden="true"></i>Exportă bibliotecă JSON</button>':'')+'</div>'+
  '<div class="card"><div class="ct"><i class="ti ti-brand-google" aria-hidden="true"></i>Google Sheets Sync</div><div class="frow"><label class="flbl">Apps Script URL</label><input type="text" id="sUrl" value="'+A.settings.sheetsUrl+'" placeholder="https://script.google.com/macros/s/..."></div><div class="frow"><label class="flbl">Spreadsheet ID</label><input type="text" id="sSpread" value="'+A.settings.spreadId+'" placeholder="1mVCUat1..."></div><button class="btn bp" id="btnSheets" onclick="saveSheets()"><i class="ti ti-check" aria-hidden="true"></i>Salvează configurația</button></div>'+
  '<div class="card"><div class="ct"><i class="ti ti-calendar-week" aria-hidden="true"></i>Plan săptămânal (template fallback)</div><p class="muted" style="margin-bottom:8px">Folosit când nu există plan lunar pentru ziua respectivă.</p><div class="frow"><textarea id="planTxt" rows="6" style="font-size:11px;font-family:monospace;resize:vertical" placeholder="#PLAN 2026-W41&#10;DAY:Luni|Push|60&#10;EX:Împins la piept cu bara|4x8@80|120&#10;DAY:Miercuri|Pull|60&#10;EX:Tracțiuni|4x8|120"></textarea></div><button class="btn bp" onclick="importPlan()"><i class="ti ti-upload" aria-hidden="true"></i>Importă template săptămânal</button>'+(planDays.length?'<p style="font-size:12px;color:#0F6E56;margin-top:8px"><i class="ti ti-check" style="vertical-align:-2px" aria-hidden="true"></i> Template activ: '+planDays.map(function(k){return DAY_RO[k];}).join(', ')+'</p>':'')+'</div>'+
  '<div class="card"><div class="ct"><i class="ti ti-download" aria-hidden="true"></i>Export date</div><p class="muted" style="margin-bottom:8px">Backup complet: nutriție, sport, corp, bibliotecă.</p><button class="btn bo" onclick="exportData()"><i class="ti ti-file-download" aria-hidden="true"></i>Descarcă backup JSON</button></div>';
}

function flashBtn(id,lbl){var b=$(id);if(!b)return;var orig=b.innerHTML;b.innerHTML='<i class="ti ti-check" aria-hidden="true"></i>'+lbl;b.style.background='#1D9E75';setTimeout(function(){b.innerHTML=orig;b.style.background='';},1600);}
function saveTargets(){A.settings.targets={cal:parseInt($('sCal').value)||2200,p:parseInt($('sP').value)||160,c:parseInt($('sC').value)||230,f:parseInt($('sF').value)||80};persist();flashBtn('btnTgt','Salvat!');showToast('✓ Ținte salvate');}
function saveSheets(){A.settings.sheetsUrl=($('sUrl').value||'').trim();A.settings.spreadId=($('sSpread').value||'').trim();persist();flashBtn('btnSheets','Salvat!');showToast('✓ Configurație Google Sheets salvată');}
function addLibEx(){var name=($('libName').value||'').trim();if(!name)return;var cat=$('libCat').value||'forta';var hw=!!$('libHasW').checked;if(A.exLib.some(function(e){return e.name.toLowerCase()===name.toLowerCase();})){showToast('"'+name+'" există deja în bibliotecă.');return;}A.exLib.push({id:genId(),name:name,category:cat,hasWeight:hw});persist();flashBtn('btnAddLib','Adăugat!');setTimeout(function(){renderSetari();},1700);}
function delLibEx(id){A.exLib=A.exLib.filter(function(e){return e.id!==id;});persist();renderSetari();}
function exportLib(){var blob=new Blob([JSON.stringify(A.exLib,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='fitai-biblioteca.json';a.click();URL.revokeObjectURL(url);}

function genPlanPrompt(){
  var now=new Date();var nm=new Date(now.getFullYear(),now.getMonth()+1,1);
  var ymStr=nm.getFullYear()+'-'+String(nm.getMonth()+1).padStart(2,'0');
  var firstMon=new Date(nm);while(firstMon.getDay()!==1)firstMon.setDate(firstMon.getDate()+1);
  var ex1=firstMon.toISOString().split('T')[0];var ex2=new Date(firstMon);ex2.setDate(ex2.getDate()+2);ex2=ex2.toISOString().split('T')[0];var ex3=new Date(firstMon);ex3.setDate(ex3.getDate()+4);ex3=ex3.toISOString().split('T')[0];
  var prompt='Generează planul lunar de antrenament în formatul exact pentru aplicația Keep It Fit.\n\nLUNA: '+MONTHS_FULL[nm.getMonth()].toUpperCase()+' '+nm.getFullYear()+'\n\nPROFIL SERGHEI:\n- Obiectiv: scădere grăsime + menținere masă musculară\n- Frecvență: 3 antrenamente/săptămână (Luni–Miercuri–Vineri)\n- Echipament: sală completă (bară olimpică, gantere, aparate)\n- Nivel: intermediar, ~2 ani experiență\n- Stilul: Push/Pull/Picioare alternând săptămânal\n\nFORMAT OBLIGATORIU — copiază EXACT acest bloc, fără alte texte:\n\n#PLAN_LUNAR '+ymStr+'\n\nDATA:'+ex1+'|Push S1 – Piept/Umeri/Triceps|60\nEX:Împins la piept cu bara|4x8@80|120\nEX:Presă cu gantere înclinat|3x10@22|90\nEX:Presă umeri cu bara|4x10@50|90\nEX:Flotări la paralele|3x12|90\nEX:Extensii triceps cablu|3x15@20|60\n\nDATA:'+ex2+'|Pull S1 – Spate/Biceps|60\nEX:Tracțiuni|4x8|120\nEX:Ramat cu bara aplecat|4x8@65|90\nEX:Ramat cu gantera|3x10@24|90\nEX:Curls cu bara|3x12@30|60\n\nDATA:'+ex3+'|Picioare S1 – Quads/Fese/Ischio|70\nEX:Genuflexiuni cu bara|4x8@90|120\nEX:Presa pentru picioare|3x12@120|90\nEX:Fandări cu gantere|3x10@20|90\nEX:Curl femural la aparat|3x12@40|60\n\n// ... continuă pentru toate 12 sesiunile (4 săptămâni × 3 zile)\n\nREGULI STRICTE:\n- 12 sesiuni total (Luni/Miercuri/Vineri, 4 săptămâni)\n- Format: DATA:YYYY-MM-DD|Denumire sesiune|Minute\n- Format: EX:Denumire exercițiu|[serii]x[rep]@[kg]|[pauza secunde]\n- Exerciții fără greutate: EX:Tracțiuni|4x8|120 (fără @)\n- Progresie: +2.5kg sau +5% la fiecare 2 săptămâni\n- Generează DOAR blocul #PLAN_LUNAR, fără alte explicații\n';
  copyText(prompt,'✓ Prompt copiat! Lipește-l în chat-ul FitAI pentru a genera planul.');
}

function importMonthPlan(){var text=($('mpTxt').value||'').trim();if(!text)return;var newPlan={},cur=null,eid=1;text.split('\n').forEach(function(raw){var line=raw.trim();if(line.startsWith('//')||!line)return;if(line.startsWith('DATA:')||line.startsWith('DATE:')){var parts=line.slice(line.indexOf(':')+1).split('|');var date=(parts[0]||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(date)){cur=date;newPlan[date]={name:(parts[1]||'Antrenament').trim(),duration:parseInt(parts[2])||60,exercises:[]};}}else if(line.startsWith('EX:')&&cur){var p=line.slice(3).split('|');var m=(p[1]||'').match(/^(\d+)x([\d\-]+)@?([\d.]+)?/i);var sets=m?parseInt(m[1]):3,reps=m?m[2]:'10',weight=m&&m[3]?parseFloat(m[3]):0;newPlan[cur].exercises.push({id:'mp'+eid++,name:(p[0]||'').trim(),sets:sets,reps:reps,weight:weight,hasWeight:weight>0});}});var count=Object.keys(newPlan).length;if(!count){showToast('Format invalid. Verifică structura DATA:/EX:');return;}A.monthPlan=Object.assign({},A.monthPlan,newPlan);persist();renderSetari();showToast('✓ '+count+' sesiuni importate în planul lunar!');}
function clearMonthPlan(){if(!confirm('Ștergi planul lunar?'))return;A.monthPlan={};persist();renderSetari();}

function importPlan(){var text=($('planTxt').value||'').trim();if(!text)return;var dayMap={'Luni':'monday','Marți':'tuesday','Miercuri':'wednesday','Joi':'thursday','Vineri':'friday','Sâmbătă':'saturday','Duminică':'sunday'};var newPlan={},cur=null,eid=1;text.split('\n').forEach(function(raw){var line=raw.trim();if(line.startsWith('DAY:')){var parts=line.slice(4).split('|');var key=dayMap[(parts[0]||'').trim()];if(key){cur=key;newPlan[key]={name:(parts[1]||parts[0]).trim(),duration:parseInt(parts[2])||60,exercises:[]};}}else if(line.startsWith('EX:')&&cur){var p2=line.slice(3).split('|');var m=(p2[1]||'').match(/^(\d+)x([\d\-]+)@?([\d.]+)?/i);var sets=m?parseInt(m[1]):3,reps=m?m[2]:'10',weight=m&&m[3]?parseFloat(m[3]):0;newPlan[cur].exercises.push({id:'e'+eid++,name:(p2[0]||'').trim(),sets:sets,reps:reps,weight:weight,hasWeight:weight>0});}});if(!Object.keys(newPlan).length){showToast('Format invalid.');return;}A.plan=newPlan;persist();renderSetari();showToast('✓ Template săptămânal importat!');}

function exportData(){var data={exportedAt:new Date().toISOString(),settings:A.settings,plan:A.plan,monthPlan:A.monthPlan,logs:A.logs,exLib:A.exLib};var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='fitai-backup-'+A.today+'.json';a.click();URL.revokeObjectURL(url);}

// ─── INIT ─────────────────────────────────────────────────
function init(){
  var now=new Date();
  A.today=now.toISOString().split('T')[0];
  A.todayKey=DAYS[now.getDay()];
  A.todayName=DAY_RO[A.todayKey];
  A.settings=dbGet('fitai-settings')||A.settings;
  A.plan=dbGet('fitai-plan')||{};
  A.monthPlan=dbGet('fitai-monthplan')||{};
  A.logs=dbGet('fitai-logs')||{};
  A.exLib=dbGet('fitai-exlib')||[];
  $('tbDate').textContent=A.todayName+', '+now.getDate()+' '+MONTHS_S[now.getMonth()]+' '+now.getFullYear();
  renderAzi();
}
init();
</script>
