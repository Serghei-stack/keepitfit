<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1A1E24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Keep It Fit">
  <title>Keep It Fit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#1A1E24; --surface:#232931; --raised:#2B323B; --line:#38414C; --line-strong:#4A5563;
      --ink:#ECEFF3; --muted:#8D97A5; --chalk:#ECEFF3; --steel:#5A6573;
      --cal:#2F7BE5; --pro:#E0384B; --carb:#F2B705; --fat:#2FA463;
      --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
      --f-num:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
      /* alias pentru stilurile inline din JS */
      --color-background-primary:var(--surface); --color-background-secondary:var(--raised);
      --color-text-primary:var(--ink); --color-text-secondary:var(--muted);
      --color-border-tertiary:var(--line); --color-border-secondary:var(--line-strong);
      --border-radius-lg:16px; --border-radius-md:10px; --font-sans:var(--f-body);
      color-scheme:dark;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;overflow:hidden}
    body{font-family:var(--f-body);font-size:15px;color:var(--ink);background:var(--bg);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
    #root{max-width:430px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column}

    /* Iconițe: doar cele funcționale se afișează */
    .ti{display:none;font-style:normal;line-height:1}
    .ti-x,.ti-check,.ti-plus,.ti-chevron-up,.ti-chevron-down,.ti-chevron-right,.ti-refresh,.ti-loader-2,.ti-pencil{display:inline-block}
    .ti-x::before{content:"✕"}.ti-check::before{content:"✓"}.ti-plus::before{content:"+";font-size:1.25em;font-weight:500}
    .ti-chevron-up::before{content:"▴"}.ti-chevron-down::before{content:"▾"}.ti-chevron-right::before{content:"›";font-size:1.3em}
    .ti-refresh::before,.ti-loader-2::before{content:"⟳"}.ti-pencil::before{content:"✎"}

    /* Bara de sus și navigația */
    .topbar{display:flex;align-items:center;gap:10px;padding:14px 18px 8px;flex-shrink:0}
    .tb-info{flex:1}
    .tb-date{font-family:var(--f-num);font-size:24px;font-weight:600;letter-spacing:.01em;line-height:1.1}
    .tb-sub{font-size:12px;color:var(--muted);margin-top:2px}
    .sync-btn{width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
    .pages{flex:1;overflow:hidden;position:relative}
    .page{position:absolute;inset:0;display:none;overflow-y:auto;padding:8px 14px 84px;-webkit-overflow-scrolling:touch}
    .page.active{display:block}
    .bottom-nav{display:flex;flex-shrink:0;height:62px;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
    .nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--muted);cursor:pointer;font-family:var(--f-body);position:relative}
    .nav-btn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .nav-btn span{font-size:11px;font-weight:500}
    .nav-btn.active{color:var(--chalk)}
    .nav-btn.active svg{stroke-width:2.1}
    .nav-btn.active::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--chalk)}

    /* Ecranul Azi: inelele */
    .hero{padding:4px 0 16px}
    .ring-wrap{position:relative;width:244px;height:244px;margin:4px auto 10px}
    .rings{width:100%;height:100%;display:block}
    .ring{transition:stroke-dashoffset 1.15s cubic-bezier(.22,.8,.2,1),opacity .2s}
    .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
    .rc-num{font-family:var(--f-num);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
    .rc-sub{font-size:13px;color:var(--muted);margin-top:4px}
    .hero-msg{text-align:center;font-size:15px;color:var(--ink);margin:2px 0 14px}
    .legend{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .lg{display:flex;align-items:center;gap:10px;min-width:0;background:var(--surface);border-radius:12px;padding:10px 12px}
    .plate{width:9px;height:34px;border-radius:3px;flex-shrink:0}
    .lg-num{font-family:var(--f-num);font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
    .lg-num small{font-size:13px;font-weight:500;color:var(--muted)}
    .lg-lbl{font-size:12px;color:var(--muted)}

    /* Bara cu discuri */
    .bb{display:flex;align-items:center;height:46px;margin:12px 0 2px}
    .bb-end{width:16px;height:10px;background:var(--steel);border-radius:2px;flex-shrink:0}
    .bb-col{width:5px;height:20px;background:var(--steel);border-radius:2px;margin:0 3px 0 1px;flex-shrink:0}
    .bb-p{width:9px;height:38px;margin-right:3px;border-radius:2px;border:1.5px solid var(--line-strong);flex-shrink:0;transition:background-color .25s,border-color .25s,transform .4s cubic-bezier(.3,1.6,.5,1)}
    .bb-p.on{background:var(--chalk);border-color:var(--chalk);transform:scaleY(1.05)}
    .bb-bar{flex:1;height:5px;background:var(--steel);border-radius:0 3px 3px 0}
    .bb-cap{font-size:13px;color:var(--muted)}
    .wk-top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .wk-name{font-family:var(--f-num);font-size:24px;font-weight:600;line-height:1.15}
    .meas-line{font-size:15px;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px 0}
    .meas-line b{font-family:var(--f-num);font-size:20px;font-weight:600;color:var(--ink)}
    .meas-line .sep{display:inline-block;width:1px;height:14px;background:var(--line-strong);margin:0 10px}

    /* Carduri și metrice */
    .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px}
    .ct{font-family:var(--f-num);font-size:19px;font-weight:600;color:var(--ink);letter-spacing:.01em;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
    .metric{background:var(--raised);border-radius:10px;padding:11px 12px}
    .ml{font-size:12px;color:var(--muted);margin-bottom:2px}
    .mv{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
    .ms{font-size:12px;color:var(--muted)}
    .prow{display:flex;align-items:center;gap:8px;margin-bottom:7px}
    .plbl{font-size:12px;color:var(--muted);width:72px;flex-shrink:0}
    .pbar{flex:1;height:5px;background:var(--raised);border-radius:3px;overflow:hidden}
    .pfill{height:100%;border-radius:3px}
    .pval{font-size:11px;color:var(--muted);width:34px;text-align:right}

    /* Mese */
    .meal{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
    .meal:last-child{border-bottom:none;padding-bottom:0}
    .meal-info{flex:1;min-width:0}
    .meal-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .meal-sub{font-size:12px;color:var(--muted);margin-top:3px}
    .mm{display:inline-flex;align-items:center;gap:4px;margin-right:10px;font-variant-numeric:tabular-nums}
    .mm b{width:4px;height:11px;border-radius:1px;display:inline-block}
    .meal-cal{font-family:var(--f-num);font-size:19px;font-weight:600;flex-shrink:0;font-variant-numeric:tabular-nums}
    .delbtn{width:36px;height:36px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:15px;flex-shrink:0}
    .delbtn:active{background:rgba(224,56,75,.15);color:#FF8A96;border-color:rgba(224,56,75,.4)}

    /* Formulare */
    .flbl{font-size:13px;color:var(--muted);margin-bottom:5px;display:block}
    .frow{margin-bottom:12px}
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
    input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px;font-family:var(--f-body);-webkit-appearance:none;appearance:none}
    input[type=number]{font-family:var(--f-num);font-size:19px;font-weight:500;-moz-appearance:textfield}
    input[type=number]::-webkit-inner-spin-button{opacity:0}
    input::placeholder,textarea::placeholder{color:#5F6976}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cal);box-shadow:0 0 0 3px rgba(47,123,229,.25)}
    select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
    input[type=checkbox]{width:20px;height:20px;flex-shrink:0;-webkit-appearance:checkbox;appearance:checkbox;accent-color:var(--chalk);padding:0}

    /* Butoane */
    .btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:13px;border-radius:12px;border:none;font-size:16px;font-weight:600;cursor:pointer;font-family:var(--f-body);margin-top:10px;transition:transform .12s,opacity .12s}
    .btn:active{transform:scale(.98)}
    .bp{background:var(--chalk);color:var(--bg)}
    .bo{background:none;border:1px solid var(--line-strong);color:var(--ink)}
    .bg{background:none;border:1px dashed var(--line-strong);color:var(--muted);font-size:14px;font-weight:500;padding:11px}
    .bw{background:rgba(224,56,75,.14);color:#FF8A96;border:none;font-size:14px;padding:10px}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cal);outline-offset:2px}

    /* Exerciții */
    .ex-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
    .ex-hdr{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer}
    .ex-name{flex:1;font-family:var(--f-num);font-size:19px;font-weight:600;line-height:1.2}
    .ex-badge{display:flex;align-items:center;gap:3px;flex-shrink:0}
    .mp{display:block;width:5px;height:18px;border-radius:2px;background:var(--line-strong);transition:background-color .25s}
    .mp.on{background:var(--chalk)}
    .ex-body{padding:0 14px 12px;display:none}
    .srow{display:flex;align-items:center;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
    .sn{font-size:13px;color:var(--muted);width:42px;flex-shrink:0}
    .sinp{width:56px;padding:7px 4px;text-align:center;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-family:var(--f-num);font-size:19px;font-weight:500}
    .slbl{font-size:12px;color:var(--muted)}
    .schk{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line-strong);background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;margin-left:auto;flex-shrink:0;transition:background-color .2s,border-color .2s,color .2s}
    .schk.done{background:var(--chalk);border-color:var(--chalk);color:var(--bg)}
    .schk.pop{animation:pop .34s ease-out}
    @keyframes pop{0%{transform:scale(.78)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

    /* Etichete de stare */
    .pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.01em}
    .pg{background:var(--chalk);color:var(--bg)}
    .pa{border:1px solid var(--line-strong);color:var(--ink)}
    .pgr{background:var(--raised);color:var(--muted)}
    .pm,.pp{border:1px solid rgba(47,123,229,.6);color:#8CB8F5}

    /* Diverse */
    .muted{font-size:14px;color:var(--muted);line-height:1.5}
    .row2{display:flex;gap:8px;margin-bottom:10px}.row2 .btn{margin-top:0;flex:1;font-size:14px;padding:11px 6px}
    .ptabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:3px;gap:3px}
    .ptab{flex:1;padding:9px;text-align:center;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);border:none;background:none;font-family:var(--f-body);border-radius:9px;transition:background-color .2s,color .2s}
    .ptab.active{background:var(--raised);color:var(--ink)}
    .tip{background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:11px 12px;display:flex;gap:8px;margin-bottom:10px}
    .tip p{font-size:13px;color:var(--ink);line-height:1.5}
    .tip-g{border-color:var(--chalk)}
    .rpt{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;max-height:240px;overflow-y:auto;margin-bottom:10px;line-height:1.6}
    .lib-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.lib-item:last-child{border-bottom:none}
    .lib-name{flex:1;font-size:14px}
    .lib-cat{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--raised);color:var(--muted)}
    .mchip{font-size:12px;padding:3px 8px;border-radius:10px;background:var(--raised);color:var(--muted);white-space:nowrap;display:inline-block;margin:2px}
    .mhist-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.mhist-row:last-child{border-bottom:none}
    .mhist-date{width:60px;flex-shrink:0}
    .agenda-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.agenda-row:last-child{border-bottom:none}
    .agenda-date{width:60px;flex-shrink:0;font-family:var(--f-num);font-size:16px;font-weight:600}
    .agenda-name{font-size:14px}.agenda-ex{font-size:12px;color:var(--muted)}
    canvas{max-width:100%}
    .toast{position:fixed;bottom:78px;left:50%;transform:translate(-50%,8px);background:var(--chalk);color:var(--bg);padding:11px 20px;border-radius:22px;font-size:14px;font-weight:600;font-family:var(--f-body);z-index:1000;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:330px;text-align:center}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}.spinning{animation:spin 1s linear infinite}

    @media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
  </style>
</head>
<body>

<div id="root">
  <header class="topbar">
    <div class="tb-info">
      <div class="tb-date" id="tbDate">—</div>
      <div class="tb-sub">Keep It Fit</div>
    </div>
    <button class="sync-btn" onclick="doSync()" id="syncBtn" aria-label="Sincronizează cu Google Sheets">
      <i class="ti ti-refresh" aria-hidden="true" id="syncIcon"></i>
    </button>
  </header>

  <div class="pages">
    <div id="p-azi"       class="page active"></div>
    <div id="p-nutritie"  class="page"></div>
    <div id="p-sport"     class="page"></div>
    <div id="p-corp"      class="page"></div>
    <div id="p-setari"    class="page"></div>
  </div>

  <nav class="bottom-nav" aria-label="Navigare principală">
    <button class="nav-btn active" id="nav-azi" onclick="goTo('azi')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z"/></svg><span>Azi</span></button>
    <button class="nav-btn" id="nav-nutritie" onclick="goTo('nutritie')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v7a2 2 0 0 0 2 2v9M4 3v5.5M8 3v5.5M17.5 3c-2.2 1.6-2.7 6.2-.5 8.5V21"/></svg><span>Nutriție</span></button>
    <button class="nav-btn" id="nav-sport" onclick="goTo('sport')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12h20M5.5 8v8M8.5 6v12M15.5 6v12M18.5 8v8"/></svg><span>Sport</span></button>
    <button class="nav-btn" id="nav-corp" onclick="goTo('corp')"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="8" width="19" height="8" rx="1.5"/><path d="M6.5 8v3M10 8v4.5M13.5 8v3M17 8v4.5"/></svg><span>Corp</span></button>
    <button class="nav-btn" id="nav-setari" onclick="goTo('setari')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span>Setări</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ─── STORAGE (localStorage) ───────────────────────────────
function dbGet(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function dbSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// ─── TOAST ────────────────────────────────────────────────
function showToast(msg,ms){var t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},ms||2800);}

// ─── CLIPBOARD ────────────────────────────────────────────
function copyText(text,successMsg){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){showToast(successMsg||'✓ Copiat în clipboard!');}).catch(function(){fallbackCopy(text,successMsg);});
  }else{fallbackCopy(text,successMsg);}
}
function fallbackCopy(text,msg){
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');showToast(msg||'✓ Copiat!');}catch(e){showToast('Copiază manual din previzualizare.');}
  document.body.removeChild(ta);
}

// ─── CONSTANTS ────────────────────────────────────────────
var DAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
var DAY_RO={monday:'Luni',tuesday:'Marți',wednesday:'Miercuri',thursday:'Joi',friday:'Vineri',saturday:'Sâmbătă',sunday:'Duminică'};
var DAY_SHORT=['Du','Lu','Ma','Mi','Jo','Vi','Sâ'];
var MONTHS_S=['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','nov','dec'];
var MONTHS_FULL=['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
var MKEYS=['weight','waist','hip','arm','thigh','chest','shoulder'];
var MLBL={weight:'Greutate',waist:'Talie',hip:'Șold',arm:'Braț',thigh:'Coapsă',chest:'Piept',shoulder:'Umăr'};
var MUNIT={weight:'kg',waist:'cm',hip:'cm',arm:'cm',thigh:'cm',chest:'cm',shoulder:'cm'};
var MPHOLD={weight:'84.5',waist:'88',hip:'98',arm:'36',thigh:'54',chest:'100',shoulder:'112'};

// ─── STATE ────────────────────────────────────────────────
var A={
  page:'azi',today:'',todayKey:'',todayName:'',
  nutTab:'jurnal',sportTab:'azi',corpMetric:'weight',
  openEx:{},showAddEx:false,showAltForm:false,syncSt:'idle',
  charts:{},reportText:'',
  settings:{targets:{cal:2200,p:160,c:230,f:80},sheetsUrl:'',spreadId:''},
  plan:{},monthPlan:{},logs:{},exLib:[]
};

// ─── HELPERS ──────────────────────────────────────────────
function $(id){return document.getElementById(id);}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function R(n){return Math.round(n||0);}
function pct(v,mx){return mx?Math.min(100,Math.round((v/mx)*100)):0;}
// Data locală (nu UTC) — evită decalajul de o zi între miezul nopții și 03:00
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtDate(d){var dt=new Date(d+'T00:00');return dt.getDate()+' '+MONTHS_S[dt.getMonth()];}
function fmtDateShort(d){var dt=new Date(d+'T00:00');return DAY_SHORT[dt.getDay()]+' '+dt.getDate()+'.'+(dt.getMonth()+1);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function todayLog(){if(!A.logs[A.today])A.logs[A.today]={meals:[],workout:null,measurements:{}};return A.logs[A.today];}

function todaySource(){
  if(A.monthPlan&&A.monthPlan[A.today])return{day:A.monthPlan[A.today],src:'lunar'};
  if(A.plan&&A.plan[A.todayKey])return{day:A.plan[A.todayKey],src:'saptamanal'};
  return{day:null,src:'manual'};
}

function todayWorkout(){
  var log=todayLog();
  if(!log.workout){var s=todaySource();log.workout={status:'pending',type:'',rpe:0,note:'',src:s.src,exercises:s.day?s.day.exercises.map(function(e){return{name:e.name,planId:e.id,hasWeight:!!e.hasWeight,sets:Array.from({length:e.sets||3},function(){return{r:parseInt(e.reps)||10,w:parseFloat(e.weight)||0,done:false};})};}):[]};}
  return log.workout;
}

function dayTotals(date){var meals=(A.logs[date]||{}).meals||[];return meals.reduce(function(a,m){return{cal:a.cal+(m.cal||0),p:a.p+(m.p||0),c:a.c+(m.c||0),f:a.f+(m.f||0)};},{cal:0,p:0,c:0,f:0});}
function lastNDates(n){return Array.from({length:n},function(_,i){var d=new Date();d.setDate(d.getDate()-(n-1-i));return ymd(d);});}
function last7Dates(){return lastNDates(7);}

function getUpcoming(n){var res=[];var now=new Date();for(var i=1;i<=45&&res.length<n;i++){var d=new Date(now);d.setDate(d.getDate()+i);var ds=ymd(d);if(A.monthPlan&&A.monthPlan[ds])res.push({date:ds,name:A.monthPlan[ds].name,exercises:(A.monthPlan[ds].exercises||[]).length,done:!!(A.logs[ds]&&A.logs[ds].workout&&A.logs[ds].workout.status==='done')});}return res;}

function threeMonthsAgo(){var cut=new Date();cut.setMonth(cut.getMonth()-3);return ymd(cut);}

function getMeasHistory(metric){var cutStr=threeMonthsAgo();var hist=[];Object.entries(A.logs).forEach(function(e){var date=e[0],log=e[1];if(date<cutStr)return;var m=log.measurements||{};if(m[metric]&&m[metric]>0)hist.push({date:date,value:m[metric]});});return hist.sort(function(a,b){return a.date.localeCompare(b.date);});}

function exHistory(name){var cutStr=threeMonthsAgo();var hist=[];Object.entries(A.logs).forEach(function(e){var date=e[0],log=e[1];if(date<cutStr)return;((log.workout||{}).exercises||[]).forEach(function(ex){if(ex.name.toLowerCase()===name.toLowerCase()){var done=ex.sets.filter(function(s){return s.done;});if(done.length)hist.push({date:date,maxW:Math.max.apply(null,done.map(function(s){return s.w||0;}))});}});});return hist.sort(function(a,b){return a.date.localeCompare(b.date);});}

function allExNamesWithWeight(){var s={};Object.values(A.logs).forEach(function(l){((l.workout||{}).exercises||[]).forEach(function(e){if(e.hasWeight)s[e.name]=1;});});A.exLib.forEach(function(e){if(e.hasWeight)s[e.name]=1;});return Object.keys(s).sort();}

function persist(){dbSet('fitai-settings',A.settings);dbSet('fitai-plan',A.plan);dbSet('fitai-monthplan',A.monthPlan);dbSet('fitai-logs',A.logs);dbSet('fitai-exlib',A.exLib);}

// ─── SYNC ─────────────────────────────────────────────────
function pushSheets(p){
  if(!A.settings.sheetsUrl)return false;
  fetch(A.settings.sheetsUrl,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(p)}).catch(function(){});
  return true;
}

function doSync(){
  A.syncSt='syncing';updateSync();
  var log=todayLog();
  var sent=pushSheets({type:'daily_log',date:A.today,nutrition:Object.assign({},dayTotals(A.today),{meals:log.meals}),workout:log.workout,measurements:log.measurements||{},targets:A.settings.targets});
  persist();
  setTimeout(function(){
    A.syncSt=sent?'synced':'idle';updateSync();
    showToast(sent?'✓ Trimis către Google Sheets (apare în ~10 sec.)':'Setează URL-ul Apps Script în Setări.');
    setTimeout(function(){A.syncSt='idle';updateSync();},2500);
  },600);
}

function updateSync(){var i=$('syncIcon');if(!i)return;if(A.syncSt==='syncing')i.className='ti ti-loader-2 spinning';else if(A.syncSt==='synced'){i.className='ti ti-check';i.style.color='var(--chalk)';}else{i.className='ti ti-refresh';i.style.color='';}}

// ─── NAVIGATION ───────────────────────────────────────────
function goTo(page){A.page=page;document.querySelectorAll('.page').forEach(function(p){p.classList.remove('active');});document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});var pg=$('p-'+page);if(pg)pg.classList.add('active');var nb=$('nav-'+page);if(nb)nb.classList.add('active');Object.values(A.charts).forEach(function(c){try{c.destroy();}catch(e){}});A.charts={};renderPage(page);}
function renderPage(p){if(p==='azi')renderAzi();else if(p==='nutritie')renderNutritie();else if(p==='sport')renderSport();else if(p==='corp')renderCorp();else if(p==='setari')renderSetari();}

// ─── PAGE: AZI ────────────────────────────────────────────
var PL={cal:'#2F7BE5',p:'#E0384B',c:'#F2B705',f:'#2FA463'};
var RING_PREV=null;
function setsDone(w){return w.exercises.reduce(function(a,e){return a+e.sets.filter(function(s){return s.done;}).length;},0);}
function setsTotal(w){return w.exercises.reduce(function(a,e){return a+e.sets.length;},0);}
function barbell(w,id){var d=setsDone(w),tt=setsTotal(w),n=Math.min(tt,18),on=Math.round(n*(tt?d/tt:0)),p='';for(var i=0;i<n;i++)p+='<i class="bb-p'+(i<on?' on':'')+'"></i>';return'<div class="bb"'+(id?' id="'+id+'"':'')+' role="img" aria-label="'+d+' din '+tt+' serii făcute"><i class="bb-end"></i><i class="bb-col"></i>'+p+'<i class="bb-bar"></i></div><p class="bb-cap">'+d+' din '+tt+' serii</p>';}
function miniPlates(ex){return ex.sets.map(function(s){return'<i class="mp'+(s.done?' on':'')+'"></i>';}).join('');}
function ringsSVG(rings){var out='';rings.forEach(function(v,i){var r=118-i*18,c=2*Math.PI*r;out+='<circle cx="130" cy="130" r="'+r+'" fill="none" stroke="'+v.color+'" stroke-opacity=".16" stroke-width="13"/><circle class="ring" data-to="'+(c*(1-v.pct/100)).toFixed(1)+'" data-c="'+c.toFixed(1)+'" cx="130" cy="130" r="'+r+'" fill="none" stroke="'+v.color+'" stroke-width="13" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" transform="rotate(-90 130 130)" style="stroke-dashoffset:'+(c*(1-v.from/100)).toFixed(1)+';transition-delay:'+(i*90)+'ms;opacity:'+(v.from>0?1:0)+'"/>';});return'<svg class="rings" viewBox="0 0 260 260" aria-hidden="true">'+out+'</svg>';}

function renderAzi(){
  var t=A.settings.targets,tot=dayTotals(A.today),src=todaySource(),wlog=todayLog().workout;
  var keys=[{k:'cal',v:tot.cal,t:t.cal,lbl:'Calorii',u:'kcal'},{k:'p',v:tot.p,t:t.p,lbl:'Proteină',u:'g'},{k:'c',v:tot.c,t:t.c,lbl:'Carbohidrați',u:'g'},{k:'f',v:tot.f,t:t.f,lbl:'Grăsimi',u:'g'}];
  var prev=RING_PREV||[0,0,0,0];
  var rings=keys.map(function(x,i){return{color:PL[x.k],pct:pct(x.v,x.t),from:prev[i]};});
  RING_PREV=rings.map(function(r){return r.pct;});
  var left=t.cal-R(tot.cal),pLeft=t.p-R(tot.p);
  var msg=!R(tot.cal)?'Nicio masă logată azi':left>=0?'Mai ai '+left+' kcal'+(pLeft>0?' și '+pLeft+' g proteină':'. Proteina e atinsă'):'Ai depășit ținta cu '+(-left)+' kcal';
  var legend=keys.map(function(x){return'<div class="lg"><span class="plate" style="background:'+PL[x.k]+'"></span><div><div class="lg-num">'+R(x.v)+'<small> / '+x.t+' '+x.u+'</small></div><div class="lg-lbl">'+x.lbl+'</div></div></div>';}).join('');
  var hero='<section class="hero"><div class="ring-wrap">'+ringsSVG(rings)+'<div class="ring-center"><div class="rc-num">'+R(tot.cal)+'</div><div class="rc-sub">din '+t.cal+' kcal</div></div></div><p class="hero-msg">'+msg+'</p><div class="legend">'+legend+'</div><button class="btn bp" onclick="goTo(\'nutritie\')"><i class="ti ti-plus" aria-hidden="true"></i>Adaugă masă</button></section>';
  var wCard;
  if(!src.day&&(!wlog||!wlog.exercises||!wlog.exercises.length)){
    wCard='<div class="card"><div class="ct">Zi de odihnă</div><p class="muted">Nicio sesiune în plan pentru azi.</p><button class="btn bg" onclick="goTo(\'sport\')"><i class="ti ti-plus" aria-hidden="true"></i>Adaugă activitate</button></div>';
  }else{
    var w=todayWorkout();
    var st=w.status==='done'?'<span class="pill pg"><i class="ti ti-check" aria-hidden="true"></i>Gata</span>':w.status==='skip'?'<span class="pill pgr">Skip</span>':w.status==='other'?'<span class="pill pa">Alt tip</span>':'<span class="pill pa">De făcut</span>';
    var sb=src.src==='lunar'?'<span class="pill pm">Plan lunar</span>':src.src==='saptamanal'?'<span class="pill pgr">Plan săptămânal</span>':'';
    wCard='<div class="card"><div class="wk-top">'+st+sb+'</div><h3 class="wk-name">'+esc(src.day?src.day.name:'Antrenament')+'</h3>'+(w.exercises.length?barbell(w):'')+'<button class="btn bo" onclick="goTo(\'sport\')">Deschide antrenamentul<i class="ti ti-chevron-right" aria-hidden="true"></i></button></div>';
  }
  var meas=todayLog().measurements||{},mParts=[];
  if(meas.weight)mParts.push('<b>'+meas.weight+'</b>&nbsp;kg');
  if(meas.waist)mParts.push('talie&nbsp;<b>'+meas.waist+'</b>&nbsp;cm');
  if(meas.arm)mParts.push('braț&nbsp;<b>'+meas.arm+'</b>&nbsp;cm');
  var mCard=mParts.length?'<div class="card"><div class="ct">Măsurători azi</div><p class="meas-line">'+mParts.join('<span class="sep"></span>')+'</p><button class="btn bg" onclick="goTo(\'corp\')"><i class="ti ti-pencil" aria-hidden="true"></i>Actualizează</button></div>':'<button class="btn bg" onclick="goTo(\'corp\')" style="margin:0 0 10px"><i class="ti ti-plus" aria-hidden="true"></i>Adaugă măsurătorile de azi</button>';
  var upcoming=getUpcoming(3);
  var upH=upcoming.length?'<div class="card"><div class="ct">Urmează</div>'+upcoming.map(function(u){return'<div class="agenda-row"><div class="agenda-date">'+fmtDateShort(u.date)+'</div><div style="flex:1"><div class="agenda-name">'+esc(u.name)+'</div><div class="agenda-ex">'+u.exercises+' exerciții</div></div>'+(u.done?'<span class="pill pg"><i class="ti ti-check" aria-hidden="true"></i>Gata</span>':'')+'</div>';}).join('')+'</div>':'';
  var l7=last7Dates();var dL=l7.filter(function(d){return A.logs[d]&&(A.logs[d].meals||[]).length>0;}).length;
  var wCal=l7.reduce(function(a,d){return a+dayTotals(d).cal;},0),wP=l7.reduce(function(a,d){return a+dayTotals(d).p;},0);
  var week='<div class="card"><div class="ct">Ultimele 7 zile</div><div class="mgrid"><div class="metric"><div class="ml">Medie calorii pe zi</div><div class="mv">'+(dL?R(wCal/dL):0)+'</div><div class="ms">'+dL+' zile logate</div></div><div class="metric"><div class="ml">Medie proteină pe zi</div><div class="mv">'+(dL?R(wP/dL):0)+' g</div><div class="ms">ținta '+t.p+' g</div></div></div></div>';
  $('p-azi').innerHTML=hero+wCard+mCard+upH+week;
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    document.querySelectorAll('#p-azi .ring').forEach(function(el){
      var to=parseFloat(el.getAttribute('data-to')),c=parseFloat(el.getAttribute('data-c'));
      el.style.opacity=to<c-0.5?1:0;
      el.style.strokeDashoffset=to;
    });
  });});
}

// ─── PAGE: NUTRIȚIE ───────────────────────────────────────
function renderNutritie(){$('p-nutritie').innerHTML='<div class="ptabs"><button class="ptab '+(A.nutTab==='jurnal'?'active':'')+'" onclick="switchNutTab(\'jurnal\')">Jurnal</button><button class="ptab '+(A.nutTab==='stats'?'active':'')+'" onclick="switchNutTab(\'stats\')">Statistici</button><button class="ptab '+(A.nutTab==='rapoarte'?'active':'')+'" onclick="switchNutTab(\'rapoarte\')">Rapoarte</button></div><div id="nutContent"></div>';renderNutContent();}
function switchNutTab(t){A.nutTab=t;document.querySelectorAll('#p-nutritie .ptab').forEach(function(b,i){b.classList.toggle('active',['jurnal','stats','rapoarte'][i]===t);});if(A.charts.cn){try{A.charts.cn.destroy();}catch(e){}}if(A.charts.cm){try{A.charts.cm.destroy();}catch(e){}}renderNutContent();}
function renderNutContent(){if(A.nutTab==='jurnal')renderNutJurnal();else if(A.nutTab==='stats')renderNutStats();else renderNutRapoarte();}

function renderNutJurnal(){var log=todayLog(),tot=dayTotals(A.today);var mh=log.meals.length?log.meals.map(function(m){return'<div class="meal"><div class="meal-info"><div class="meal-name">'+esc(m.name)+'</div><div class="meal-sub"><span class="mm">'+(m.time||'')+'</span><span class="mm"><b style="background:var(--pro)"></b>P '+R(m.p)+'</span><span class="mm"><b style="background:var(--carb)"></b>C '+R(m.c)+'</span><span class="mm"><b style="background:var(--fat)"></b>G '+R(m.f)+'</span></div></div><div class="meal-cal">'+R(m.cal)+' kcal</div><button class="delbtn" onclick="delMeal(\''+m.id+'\')" aria-label="Șterge masa"><i class="ti ti-x" aria-hidden="true"></i></button></div>';}).join(''):'<p class="muted" style="padding:6px 0">Nicio masă adăugată azi.</p>';$('nutContent').innerHTML='<div class="card"><div class="ct"><i class="ti ti-plus-circle" aria-hidden="true"></i>Adaugă masă</div><div class="frow"><label class="flbl">Denumire</label><input type="text" id="mN" placeholder="ex: Piept pui 200g la grătar"></div><div class="frow"><label class="flbl">Calorii (kcal)</label><input type="number" id="mK" placeholder="0" inputmode="numeric"></div><div class="g3" style="margin-bottom:10px"><div><label class="flbl">Proteină g</label><input type="number" id="mP" placeholder="0" inputmode="numeric"></div><div><label class="flbl">Carb g</label><input type="number" id="mC" placeholder="0" inputmode="numeric"></div><div><label class="flbl">Grăsimi g</label><input type="number" id="mF" placeholder="0" inputmode="numeric"></div></div><button class="btn bp" onclick="addMeal()"><i class="ti ti-check" aria-hidden="true"></i>Adaugă</button></div><div class="card"><div class="ct"><i class="ti ti-list" aria-hidden="true"></i>Mese azi, '+R(tot.cal)+' kcal</div>'+mh+'</div>';}
function addMeal(){var name=($('mN').value||'').trim();if(!name){showToast('Scrie denumirea mesei.');return;}todayLog().meals.push({id:genId(),name:name,cal:parseFloat($('mK').value)||0,p:parseFloat($('mP').value)||0,c:parseFloat($('mC').value)||0,f:parseFloat($('mF').value)||0,time:new Date().toTimeString().slice(0,5)});persist();renderNutJurnal();showToast('✓ Masă adăugată');}
function delMeal(id){var log=todayLog();log.meals=log.meals.filter(function(m){return m.id!==id;});persist();renderNutJurnal();showToast('Masă ștearsă. Apasă ⟳ ca să actualizezi Sheets.');}

function renderNutStats(){var l7=last7Dates(),t=A.settings.targets;var calData=l7.map(function(d){return R(dayTotals(d).cal);});var pData=l7.map(function(d){return R(dayTotals(d).p);});var cData=l7.map(function(d){return R(dayTotals(d).c);});var fData=l7.map(function(d){return R(dayTotals(d).f);});var labels=l7.map(function(d){var dt=new Date(d+'T00:00');return DAY_SHORT[dt.getDay()]+' '+dt.getDate();});var dL=l7.filter(function(d){return A.logs[d]&&(A.logs[d].meals||[]).length>0;}).length;function avg(arr){return dL?R(arr.reduce(function(a,v){return a+v;},0)/dL):0;}$('nutContent').innerHTML='<div class="card"><div class="ct"><i class="ti ti-chart-bar" aria-hidden="true"></i>Calorii · 7 zile</div><canvas id="cChart" height="150"></canvas></div><div class="card"><div class="ct"><i class="ti ti-calculator" aria-hidden="true"></i>Medii săptămânale</div><div class="mgrid"><div class="metric"><div class="ml">Calorii/zi</div><div class="mv">'+avg(calData)+'</div><div class="ms">obiectiv '+t.cal+'</div></div><div class="metric"><div class="ml">Proteină/zi</div><div class="mv">'+avg(pData)+'g</div><div class="ms">obiectiv '+t.p+'g</div></div><div class="metric"><div class="ml">Carb/zi</div><div class="mv">'+avg(cData)+'g</div><div class="ms">obiectiv '+t.c+'g</div></div><div class="metric"><div class="ml">Grăsimi/zi</div><div class="mv">'+avg(fData)+'g</div><div class="ms">obiectiv '+t.f+'g</div></div></div></div><div class="card"><div class="ct"><i class="ti ti-chart-line" aria-hidden="true"></i>Macronutrienți · 7 zile</div><canvas id="mChart" height="150"></canvas></div>';setTimeout(function(){if(typeof Chart==='undefined'){showToast('Graficele nu s-au încărcat (verifică conexiunea).');return;}var gc='rgba(255,255,255,.06)',tc='#8D97A5';var c1=$('cChart');if(c1)A.charts.cn=new Chart(c1,{type:'bar',data:{labels:labels,datasets:[{type:'line',data:l7.map(function(){return t.cal;}),borderColor:'rgba(236,239,243,.55)',borderDash:[5,4],borderWidth:1.5,pointRadius:0,fill:false},{data:calData,backgroundColor:'#2F7BE5',borderRadius:4}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.parsed.y+' kcal';}}}},scales:{y:{grid:{color:gc},ticks:{color:tc,font:{size:10}}},x:{grid:{display:false},ticks:{color:tc,font:{size:10}}}}}});var c2=$('mChart');if(c2)A.charts.cm=new Chart(c2,{type:'line',data:{labels:labels,datasets:[{label:'Proteină',data:pData,borderColor:'#E0384B',backgroundColor:'#E0384B',tension:.3,fill:false,pointRadius:3,borderWidth:2.5},{label:'Carbohidrați',data:cData,borderColor:'#F2B705',backgroundColor:'#F2B705',tension:.3,fill:false,pointRadius:3,borderWidth:2.5},{label:'Grăsimi',data:fData,borderColor:'#2FA463',backgroundColor:'#2FA463',tension:.3,fill:false,pointRadius:3,borderWidth:2.5}]},options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:10,padding:8}}},scales:{y:{grid:{color:gc},ticks:{color:tc,font:{size:10}}},x:{grid:{display:false},ticks:{color:tc,font:{size:10}}}}}});},80);}

function renderNutRapoarte(){var rptHtml=A.reportText?'<div class="rpt">'+esc(A.reportText)+'</div><div style="display:flex;gap:8px;margin-bottom:10px"><button class="btn bp" style="flex:1;margin:0" onclick="sendRpt()"><i class="ti ti-copy" aria-hidden="true"></i>Copiază pentru FitAI</button><button class="btn bo" style="flex:1;margin:0" onclick="dlRpt()"><i class="ti ti-download" aria-hidden="true"></i>Descarcă .txt</button></div>':'';$('nutContent').innerHTML='<div class="card"><div class="ct"><i class="ti ti-file-analytics" aria-hidden="true"></i>Generează raport</div><p class="muted" style="margin-bottom:10px">Include nutriție, antrenamente și măsurători corporale.</p><div class="row2"><button class="btn bo" onclick="showRpt(\'week\')" style="margin-top:0"><i class="ti ti-calendar-week" aria-hidden="true"></i>Săptămânal</button><button class="btn bo" onclick="showRpt(\'month\')" style="margin-top:0"><i class="ti ti-calendar-month" aria-hidden="true"></i>Lunar</button></div>'+rptHtml+'</div>';}

sLines+'\n';txt+='=== GENERAT DIN KEEP IT FIT ===';return txt;}

// ─── PAGE: CORP ───────────────────────────────────────────
function renderCorp(){var log=todayLog(),meas=log.measurements||{};var formHtml='<div class="card"><div class="ct"><i class="ti ti-ruler" aria-hidden="true"></i>Adaugă măsurători azi</div><div class="g2"><div><label class="flbl">Greutate kg</label><input type="number" id="weightInp" value="'+(meas.weight||'')+'" placeholder="'+MPHOLD.weight+'" step="0.1" inputmode="decimal"></div><div><label class="flbl">Talie cm</label><input type="number" id="waistInp" value="'+(meas.waist||'')+'" placeholder="'+MPHOLD.waist+'" inputmode="numeric"></div></div><div class="g2" style="margin-top:8px"><div><label class="flbl">Șold cm</label><input type="number" id="hipInp" value="'+(meas.hip||'')+'" placeholder="'+MPHOLD.hip+'" inputmode="numeric"></div><div><label class="flbl">Braț cm</label><input type="number" id="armInp" value="'+(meas.arm||'')+'" placeholder="'+MPHOLD.arm+'" inputmode="numeric"></div></div><div class="g2" style="margin-top:8px"><div><label class="flbl">Coapsă cm</label><input type="number" id="thighInp" value="'+(meas.thigh||'')+'" placeholder="'+MPHOLD.thigh+'" inputmode="numeric"></div><div><label class="flbl">Piept cm</label><input type="number" id="chestInp" value="'+(meas.chest||'')+'" placeholder="'+MPHOLD.chest+'" inputmode="numeric"></div></div><div class="frow" style="margin-top:8px"><label class="flbl">Umăr cm</label><input type="number" id="shoulderInp" value="'+(meas.shoulder||'')+'" placeholder="'+MPHOLD.shoulder+'" inputmode="numeric"></div><button class="btn bp" id="btnSaveMeas" onclick="saveMeasurements()"><i class="ti ti-check" aria-hidden="true"></i>Salvează măsurătorile</button></div>';var measDates=Object.entries(A.logs).filter(function(e){var m=e[1].measurements;return m&&Object.values(m).some(function(v){return v>0;});}).map(function(e){return e[0];}).sort(function(a,b){return b.localeCompare(a);}).slice(0,6);var histHtml='<div class="card"><div class="ct"><i class="ti ti-history" aria-hidden="true"></i>Ultimele înregistrări</div>'+(measDates.length?measDates.map(function(date){var m=A.logs[date].measurements||{};var chips=MKEYS.filter(function(k){return m[k]&&m[k]>0;}).map(function(k){return'<span class="mchip">'+MLBL[k]+': '+m[k]+MUNIT[k]+'</span>';}).join('');return'<div class="mhist-row"><div class="mhist-date"><div style="font-size:12px;font-weight:600;color:var(--color-text-primary)">'+fmtDate(date)+'</div><div style="font-size:10px;color:var(--color-text-secondary)">'+date.slice(0,4)+'</div></div><div style="flex:1;display:flex;flex-wrap:wrap">'+chips+'</div></div>';}).join(''):'<p class="muted">Nicio măsurătoare logată.</p>')+'</div>';var metricOpts=MKEYS.map(function(k){return'<option value="'+k+'"'+(A.corpMetric===k?' selected':'')+'>'+MLBL[k]+' ('+MUNIT[k]+')</option>';}).join('');$('p-corp').innerHTML=formHtml+histHtml+'<div class="card"><div class="ct"><i class="ti ti-chart-line" aria-hidden="true"></i>Evoluție · 3 luni</div><div class="frow"><label class="flbl">Măsurătoare</label><select id="corpMetricSel" onchange="showCorpChart(this.value)">'+metricOpts+'</select></div><canvas id="corpChart" height="180"></canvas><p class="muted" id="corpNote" style="margin-top:6px;font-size:11px">Selectează o măsurătoare.</p></div>';setTimeout(function(){showCorpChart(A.corpMetric);},100);}
function saveMeasurements(){var log=todayLog();if(!log.measurements)log.measurements={};['weight','waist','hip','arm','thigh','chest','shoulder'].forEach(function(f){var el=$(f+'Inp');if(el&&el.value!=='')log.measurements[f]=parseFloat(el.value)||0;});persist();doSync();flashBtn('btnSaveMeas','Salvat!');}
function showCorpChart(metric){A.corpMetric=metric;var sel=$('corpMetricSel');if(sel)sel.value=metric;if(A.charts.corp){try{A.charts.corp.destroy();}catch(e){}}var hist=getMeasHistory(metric),note=$('corpNote'),ctx=$('corpChart');if(!hist.length){if(note)note.textContent='Nicio înregistrare pentru '+MLBL[metric]+' în ultimele 3 luni.';return;}var vals=hist.map(function(h){return h.value;});var delta=(vals[vals.length-1]-vals[0]).toFixed(1);var sign=parseFloat(delta)>0?'+':'';if(note)note.textContent=hist.length+' înregistrări · '+vals[0]+' → '+vals[vals.length-1]+' '+MUNIT[metric]+' ('+sign+delta+')';if(typeof Chart==='undefined'||!ctx)return;var gc='rgba(255,255,255,.06)',tc='#8D97A5';var color='#ECEFF3';A.charts.corp=new Chart(ctx,{type:'line',data:{labels:hist.map(function(h){var d=new Date(h.date+'T00:00');return d.getDate()+'.'+(d.getMonth()+1);}),datasets:[{data:vals,borderColor:color,backgroundColor:'rgba(0,0,0,0)',tension:.3,fill:false,pointRadius:5,pointBackgroundColor:color}]},options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:function(c){return c.parsed.y+' '+MUNIT[metric];}}}},scales:{y:{grid:{color:gc},ticks:{color:tc,font:{size:10},callback:function(v){return v+MUNIT[metric];}}},x:{grid:{display:false},ticks:{color:tc,font:{size:10}}}}}});}

// ─── PAGE: SETĂRI ─────────────────────────────────────────
function renderSetari(){
  var t=A.settings.targets,planDays=Object.keys(A.plan),mpCount=Object.keys(A.monthPlan).length;
  var mpDates=Object.keys(A.monthPlan).sort().slice(0,4).map(function(d){return fmtDateShort(d);});
  var libHtml=A.exLib.length?A.exLib.map(function(e){return'<div class="lib-item"><span class="lib-name">'+esc(e.name)+'</span><span class="lib-cat">'+(e.category==='forta'?'Forță':e.category==='cardio'?'Cardio':'Mobilitate')+'</span>'+(e.hasWeight?'<span class="lib-cat">kg</span>':'')+'<button class="delbtn" onclick="delLibEx(\''+e.id+'\')" aria-label="Șterge"><i class="ti ti-x" aria-hidden="true"></i></button></div>';}).join(''):'<p class="muted" style="padding:4px 0">Biblioteca e goală.</p>';
  $('p-setari').innerHTML=
  '<div class="card"><div class="ct"><i class="ti ti-target" aria-hidden="true"></i>Ținte zilnice</div><div class="frow"><label class="flbl">Calorii (kcal)</label><input type="number" id="sCal" value="'+t.cal+'" inputmode="numeric"></div><div class="g3" style="margin-bottom:10px"><div><label class="flbl">Proteină g</label><input type="number" id="sP" value="'+t.p+'" inputmode="numeric"></div><div><label class="flbl">Carb g</label><input type="number" id="sC" value="'+t.c+'" inputmode="numeric"></div><div><label class="flbl">Grăsimi g</label><input type="number" id="sF" value="'+t.f+'" inputmode="numeric"></div></div><button class="btn bp" id="btnTgt" onclick="saveTargets()"><i class="ti ti-check" aria-hidden="true"></i>Salvează țintele</button></div>'+
  '<div class="card" style="border-color:var(--line-strong)"><div class="ct"><i class="ti ti-calendar-month" aria-hidden="true"></i>Plan lunar'+(mpCount?'<span class="pill pm" style="margin-left:6px">'+mpCount+' sesiuni</span>':'')+'</div>'+(mpCount?'<div class="tip tip-g" style="margin-bottom:10px"><i class="ti ti-check" aria-hidden="true"></i><p>Plan activ: '+mpDates.join(', ')+'...</p></div>':'<div class="tip" style="margin-bottom:10px"><i class="ti ti-info-circle" aria-hidden="true"></i><p>Fără plan importat. Copiază prompt-ul, cere planul FitAI, lipește răspunsul jos.</p></div>')+'<button class="btn bp" onclick="genPlanPrompt()" style="margin-bottom:10px"><i class="ti ti-copy" aria-hidden="true"></i>Copiază prompt pentru FitAI</button><p class="flbl" style="margin-bottom:6px">Lipește planul generat:</p><div class="frow"><textarea id="mpTxt" rows="8" style="font-size:11px;font-family:monospace;resize:vertical" placeholder="#PLAN_LUNAR 2026-11&#10;&#10;DATA:2026-11-02|Push S1|60&#10;EX:Împins la piept cu bara|4x8@80|120&#10;EX:Flotări la paralele|3x12|90&#10;&#10;DATA:2026-11-04|Pull S1|60&#10;EX:Tracțiuni|4x8|120"></textarea></div><button class="btn bp" id="btnImportMP" onclick="importMonthPlan()"><i class="ti ti-upload" aria-hidden="true"></i>Importă plan lunar</button>'+(mpCount?'<button class="btn bw" onclick="clearMonthPlan()" style="margin-top:6px;font-size:12px;padding:9px"><i class="ti ti-trash" aria-hidden="true"></i>Șterge planul lunar</button>':'')+'</div>'+
  '<div class="card"><div class="ct"><i class="ti ti-dumbbell" aria-hidden="true"></i>Bibliotecă exerciții</div><div class="frow"><label class="flbl">Denumire exercițiu</label><input type="text" id="libName" placeholder="ex: Împins la piept cu bara"></div><div class="g2" style="margin-bottom:10px"><div><label class="flbl">Categorie</label><select id="libCat"><option value="forta">Forță</option><option value="cardio">Cardio</option><option value="mobilitate">Mobilitate</option></select></div><div style="display:flex;flex-direction:column;justify-content:flex-end"><div style="display:flex;align-items:center;gap:8px;padding-bottom:10px"><input type="checkbox" id="libHasW"><label for="libHasW" style="font-size:13px;color:var(--color-text-secondary);cursor:pointer">Cu greutate (kg)</label></div></div></div><button class="btn bp" id="btnAddLib" onclick="addLibEx()"><i class="ti ti-plus" aria-hidden="true"></i>Adaugă în bibliotecă</button><div style="margin-top:12px">'+libHtml+'</div>'+(A.exLib.length?'<button class="btn bo" onclick="exportLib()" style="margin-top:8px;font-size:12px;padding:9px"><i class="ti ti-download" aria-hidden="true"></i>Exportă bibliotecă JSON</button>':'')+'</div>'+
  '<div class="card"><div class="ct"><i class="ti ti-brand-google" aria-hidden="true"></i>Google Sheets Sync</div><div class="frow"><label class="flbl">Apps Script URL</label><input type="text" id="sUrl" value="'+esc(A.settings.sheetsUrl)+'" placeholder="https://script.google.com/macros/s/..."></div><div class="frow"><label class="flbl">Spreadsheet ID (opțional, doar notă)</label><input type="text" id="sSpread" value="'+esc(A.settings.spreadId)+'" placeholder="1mVCUat1..."></div><button class="btn bp" id="btnSheets" onclick="saveSheets()"><i class="ti ti-check" aria-hidden="true"></i>Salvează configurația</button></div>'+
  '<div class="card"><div class="ct"><i class="ti ti-calendar-week" aria-hidden="true"></i>Plan săptămânal (template fallback)</div><p class="muted" style="margin-bottom:8px">Folosit când nu există plan lunar pentru ziua respectivă.</p><div class="frow"><textarea id="planTxt" rows="6" style="font-size:11px;font-family:monospace;resize:vertical" placeholder="#PLAN 2026-W45&#10;DAY:Luni|Push|60&#10;EX:Împins la piept cu bara|4x8@80|120&#10;DAY:Miercuri|Pull|60&#10;EX:Tracțiuni|4x8|120"></textarea></div><button class="btn bp" onclick="importPlan()"><i class="ti ti-upload" aria-hidden="true"></i>Importă template săptămânal</button>'+(planDays.length?'<p style="font-size:12px;color:var(--chalk);margin-top:8px"><i class="ti ti-check" aria-hidden="true"></i> Template activ: '+planDays.map(function(k){return DAY_RO[k];}).join(', ')+'</p>':'')+'</div>'+
  '<div class="card"><div class="ct"><i class="ti ti-download" aria-hidden="true"></i>Export date</div><p class="muted" style="margin-bottom:8px">Backup complet: nutriție, sport, corp, bibliotecă.</p><button class="btn bo" onclick="exportData()"><i class="ti ti-file-download" aria-hidden="true"></i>Descarcă backup JSON</button></div>';
}

function flashBtn(id,lbl){var b=$(id);if(!b)return;var orig=b.innerHTML;b.innerHTML='<i class="ti ti-check" aria-hidden="true"></i>'+lbl;setTimeout(function(){b.innerHTML=orig;b.style.background='';},1600);}
function saveTargets(){A.settings.targets={cal:parseInt($('sCal').value)||2200,p:parseInt($('sP').value)||160,c:parseInt($('sC').value)||230,f:parseInt($('sF').value)||80};persist();flashBtn('btnTgt','Salvat!');showToast('✓ Ținte salvate');}
function saveSheets(){A.settings.sheetsUrl=($('sUrl').value||'').trim();A.settings.spreadId=($('sSpread').value||'').trim();persist();flashBtn('btnSheets','Salvat!');showToast('✓ Configurație Google Sheets salvată');}
function addLibEx(){var name=($('libName').value||'').trim();if(!name)return;var cat=$('libCat').value||'forta';var hw=!!$('libHasW').checked;if(A.exLib.some(function(e){return e.name.toLowerCase()===name.toLowerCase();})){showToast('"'+name+'" există deja în bibliotecă.');return;}A.exLib.push({id:genId(),name:name,category:cat,hasWeight:hw});persist();flashBtn('btnAddLib','Adăugat!');setTimeout(function(){renderSetari();},1700);}
function delLibEx(id){A.exLib=A.exLib.filter(function(e){return e.id!==id;});persist();renderSetari();}
function exportLib(){var blob=new Blob([JSON.stringify(A.exLib,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='fitai-biblioteca.json';a.click();URL.revokeObjectURL(url);}

function genPlanPrompt(){
  var now=new Date();var nm=new Date(now.getFullYear(),now.getMonth()+1,1);
  var ymStr=nm.getFullYear()+'-'+String(nm.getMonth()+1).padStart(2,'0');
  var firstMon=new Date(nm);while(firstMon.getDay()!==1)firstMon.setDate(firstMon.getDate()+1);
  var ex1=ymd(firstMon);var d2=new Date(firstMon);d2.setDate(d2.getDate()+2);var ex2=ymd(d2);var d3=new Date(firstMon);d3.setDate(d3.getDate()+4);var ex3=ymd(d3);
  var prompt='Generează planul lunar de antrenament în formatul exact pentru aplicația Keep It Fit.\n\nLUNA: '+MONTHS_FULL[nm.getMonth()].toUpperCase()+' '+nm.getFullYear()+'\n\nPROFIL SERGHEI:\n- Obiectiv: scădere grăsime + menținere masă musculară\n- Frecvență: 3 antrenamente/săptămână (Luni–Miercuri–Vineri)\n- Echipament: sală completă (bară olimpică, gantere, aparate)\n- Nivel: intermediar, ~2 ani experiență\n- Stilul: Push/Pull/Picioare alternând săptămânal\n\nFORMAT OBLIGATORIU — copiază EXACT acest bloc, fără alte texte:\n\n#PLAN_LUNAR '+ymStr+'\n\nDATA:'+ex1+'|Push S1 – Piept/Umeri/Triceps|60\nEX:Împins la piept cu bara|4x8@80|120\nEX:Presă cu gantere înclinat|3x10@22|90\nEX:Presă umeri cu bara|4x10@50|90\nEX:Flotări la paralele|3x12|90\nEX:Extensii triceps cablu|3x15@20|60\n\nDATA:'+ex2+'|Pull S1 – Spate/Biceps|60\nEX:Tracțiuni|4x8|120\nEX:Ramat cu bara aplecat|4x8@65|90\nEX:Ramat cu gantera|3x10@24|90\nEX:Curls cu bara|3x12@30|60\n\nDATA:'+ex3+'|Picioare S1 – Quads/Fese/Ischio|70\nEX:Genuflexiuni cu bara|4x8@90|120\nEX:Presa pentru picioare|3x12@120|90\nEX:Fandări cu gantere|3x10@20|90\nEX:Curl femural la aparat|3x12@40|60\n\n// ... continuă pentru toate 12 sesiunile (4 săptămâni × 3 zile)\n\nREGULI STRICTE:\n- 12 sesiuni total (Luni/Miercuri/Vineri, 4 săptămâni)\n- Format: DATA:YYYY-MM-DD|Denumire sesiune|Minute\n- Format: EX:Denumire exercițiu|[serii]x[rep]@[kg]|[pauza secunde]\n- Exerciții fără greutate: EX:Tracțiuni|4x8|120 (fără @)\n- Progresie: +2.5kg sau +5% la fiecare 2 săptămâni\n- Generează DOAR blocul #PLAN_LUNAR, fără alte explicații\n';
  copyText(prompt,'✓ Prompt copiat! Lipește-l în chat-ul FitAI pentru a genera planul.');
}

function importMonthPlan(){var text=($('mpTxt').value||'').trim();if(!text)return;var newPlan={},cur=null,eid=1;text.split('\n').forEach(function(raw){var line=raw.trim();if(line.indexOf('//')===0||!line)return;if(line.indexOf('DATA:')===0||line.indexOf('DATE:')===0){var parts=line.slice(line.indexOf(':')+1).split('|');var date=(parts[0]||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(date)){cur=date;newPlan[date]={name:(parts[1]||'Antrenament').trim(),duration:parseInt(parts[2])||60,exercises:[]};}}else if(line.indexOf('EX:')===0&&cur){var p=line.slice(3).split('|');var m=(p[1]||'').match(/^(\d+)x([\d\-]+)@?([\d.]+)?/i);var sets=m?parseInt(m[1]):3,reps=m?m[2]:'10',weight=m&&m[3]?parseFloat(m[3]):0;newPlan[cur].exercises.push({id:'mp'+eid++,name:(p[0]||'').trim(),sets:sets,reps:reps,weight:weight,hasWeight:weight>0});}});var count=Object.keys(newPlan).length;if(!count){showToast('Format invalid. Verifică structura DATA:/EX:');return;}A.monthPlan=Object.assign({},A.monthPlan,newPlan);persist();renderSetari();showToast('✓ '+count+' sesiuni importate în planul lunar!');}
function clearMonthPlan(){if(!confirm('Ștergi planul lunar?'))return;A.monthPlan={};persist();renderSetari();}

function importPlan(){var text=($('planTxt').value||'').trim();if(!text)return;var dayMap={'Luni':'monday','Marți':'tuesday','Miercuri':'wednesday','Joi':'thursday','Vineri':'friday','Sâmbătă':'saturday','Duminică':'sunday'};var newPlan={},cur=null,eid=1;text.split('\n').forEach(function(raw){var line=raw.trim();if(line.indexOf('DAY:')===0){var parts=line.slice(4).split('|');var key=dayMap[(parts[0]||'').trim()];if(key){cur=key;newPlan[key]={name:(parts[1]||parts[0]).trim(),duration:parseInt(parts[2])||60,exercises:[]};}}else if(line.indexOf('EX:')===0&&cur){var p2=line.slice(3).split('|');var m=(p2[1]||'').match(/^(\d+)x([\d\-]+)@?([\d.]+)?/i);var sets=m?parseInt(m[1]):3,reps=m?m[2]:'10',weight=m&&m[3]?parseFloat(m[3]):0;newPlan[cur].exercises.push({id:'e'+eid++,name:(p2[0]||'').trim(),sets:sets,reps:reps,weight:weight,hasWeight:weight>0});}});if(!Object.keys(newPlan).length){showToast('Format invalid.');return;}A.plan=newPlan;persist();renderSetari();showToast('✓ Template săptămânal importat!');}

function exportData(){var data={exportedAt:new Date().toISOString(),settings:A.settings,plan:A.plan,monthPlan:A.monthPlan,logs:A.logs,exLib:A.exLib};var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='fitai-backup-'+A.today+'.json';a.click();URL.revokeObjectURL(url);}

// ─── INIT ─────────────────────────────────────────────────
function init(){
  if(window.Chart){Chart.defaults.color='#8D97A5';Chart.defaults.font.family="'Barlow',system-ui,sans-serif";Chart.defaults.borderColor='rgba(255,255,255,.06)';}
  var now=new Date();
  A.today=ymd(now);
  A.todayKey=DAYS[now.getDay()];
  A.todayName=DAY_RO[A.todayKey];
  A.settings=dbGet('fitai-settings')||A.settings;
  A.plan=dbGet('fitai-plan')||{};
  A.monthPlan=dbGet('fitai-monthplan')||{};
  A.logs=dbGet('fitai-logs')||{};
  A.exLib=dbGet('fitai-exlib')||[];
  $('tbDate').textContent=A.todayName+', '+now.getDate()+' '+MONTHS_S[now.getMonth()]+' '+now.getFullYear();
  renderAzi();
}
init();
</script>
